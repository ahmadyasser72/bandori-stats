name: deploy-cloudflare-worker

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-worker-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun run --workspaces check

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun prettier . --check

  build:
    needs: [check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-bun

      - name: Cache bestdori responses
        uses: actions/cache@v6.1.0
        with:
          path: .bestdori-cache
          key: bestdori-response-${{ github.run_id }}
          restore-keys: bestdori-response-

      - name: Clean old responses
        run: find .bestdori-cache -type f -mtime +84 -print -delete

      - name: Cache Astro build fonts
        uses: actions/cache@v6.1.0
        with:
          path: site/node_modules/.astro/fonts
          key: astro-font-${{ github.run_id }}
          restore-keys: astro-font-

      - name: Build site
        run: bun run --cwd=site build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TRIGGER_SECRET_KEY: ${{ secrets.TRIGGER_SECRET_KEY }}
          UMAMI_SITE_ID: ${{ vars.UMAMI_SITE_ID }}

      - name: Upload site build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: site
          include-hidden-files: true
          path: |
            site/dist/
            site/.wrangler/

  deploy:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@v8.0.1
        with:
          path: site

      - name: Deploy to Cloudflare Workers
        id: deploy-cloudflare-worker
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: site/
          secrets: |
            DATABASE_URL
            DATABASE_AUTH_TOKEN
            DISCORD_APPLICATION_ID
            DISCORD_APPLICATION_PUBLIC_KEY
            UPSTASH_REDIS_REST_URL
            UPSTASH_REDIS_REST_TOKEN
            TRIGGER_SECRET_KEY
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_APPLICATION_PUBLIC_KEY: ${{ secrets.DISCORD_APPLICATION_PUBLIC_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TRIGGER_SECRET_KEY: ${{ secrets.TRIGGER_SECRET_KEY }}

      - name: Register Discord commands
        if: ${{ github.ref == 'refs/heads/main' }}
        run: bun run packages/discord-bot/src/register.ts
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_APPLICATION_TOKEN: ${{ secrets.DISCORD_APPLICATION_TOKEN }}
