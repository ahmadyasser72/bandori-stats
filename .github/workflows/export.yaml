name: export-database

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      release:
        type: boolean

env:
  DATABASE_NAME: "bestdori-leaderboard"

jobs:
  export:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Setup Turso CLI
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> $GITHUB_PATH

      - name: Dump SQL
        run: turso db shell ${{ env.DATABASE_NAME }} ".dump" > ${{ env.DATABASE_NAME }}.sql
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}

      - name: Upload SQLite dump
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.DATABASE_NAME }}-sqlite-dump
          path: ${{ env.DATABASE_NAME }}.sql
          compression-level: 9

      - name: Export DB
        run: turso db export ${{ env.DATABASE_NAME }} --output-file ${{ env.DATABASE_NAME }}.db
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}

      - name: Upload SQLite DB
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.DATABASE_NAME }}-sqlite-database
          path: |
            ${{ env.DATABASE_NAME }}.db
            ${{ env.DATABASE_NAME }}.db-wal
          compression-level: 9

      - name: Determine release
        id: release
        env:
          FORCE_RELEASE: ${{ github.event.inputs.release || 'false' }}
        run: |
          if [ "$FORCE_RELEASE" = "true" ] || [ "$(date -u +%d)" = "01" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(date -u +'%Y%m')" >> "$GITHUB_OUTPUT"
            echo "name=$(date -u +'%B %Y')" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compress release assets
        if: steps.release.outputs.release == 'true'
        run: |
          zip -9 "${{ env.DATABASE_NAME }}.sql.zip" "${{ env.DATABASE_NAME }}.sql"
          zip -9 "${{ env.DATABASE_NAME }}.db.zip" "${{ env.DATABASE_NAME }}.db"

          if [ -f "${{ env.DATABASE_NAME }}.db-wal" ]; then
            zip -9 "${{ env.DATABASE_NAME }}.db-wal.zip" "${{ env.DATABASE_NAME }}.db-wal"
          fi

      - name: Create monthly release
        if: steps.release.outputs.release == 'true'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }} Database Snapshot
          body: Automated monthly snapshot of the database
          make_latest: true
          overwrite_files: true
          files: |
            ${{ env.DATABASE_NAME }}.sql.zip
            ${{ env.DATABASE_NAME }}.db.zip
            ${{ env.DATABASE_NAME }}.db-wal.zip
